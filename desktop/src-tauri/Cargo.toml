[package]
name = "locksmith-desktop"
version = "3.0.1"
description = "Locksmith Cockpit - Biometric Credential Control Plane"
authors = ["bonjoski"]
edition = "2021"

[lib]
name = "locksmith_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }
cc = "1.0"

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon", "devtools"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
libc = "0.2"
