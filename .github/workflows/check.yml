name: check
on:
  push:
    branches: [main, feature/**]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-check:
    name: Code Quality & Security
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Validate workflow files
        run: |
          chmod +x scripts/dev/validate-workflows.sh
          ./scripts/dev/validate-workflows.sh

      - name: Validate Airlock Policy & Sandbox Readiness (SHA-256 Pinned v0.12.0)
        run: |
          set -euo pipefail
          AIRLOCK_URL="https://github.com/bonjoski/airlock/releases/download/v0.12.0/airlock_darwin_arm64.tar.gz"
          AIRLOCK_SHA256="93ab261bdb6e0760da1497a72a33ac40c0297ecf4791c177ae3ab55323ef139a"
          TMP_TGZ="$(mktemp)"
          curl -fsSL "$AIRLOCK_URL" -o "$TMP_TGZ"
          echo "${AIRLOCK_SHA256}  ${TMP_TGZ}" | shasum -a 256 -c -
          mkdir -p "$HOME/.airlock/bin"
          tar -xzf "$TMP_TGZ" -C "$HOME/.airlock/bin" ./airlock
          rm -f "$TMP_TGZ"
          "$HOME/.airlock/bin/airlock" --version
          "$HOME/.airlock/bin/airlock" doctor || true
          "$HOME/.airlock/bin/airlock" config validate --config ./airlock.yaml

      - name: Run Argus Dependency Provenance Scan
        run: |
          make argus-scan

      - name: Run Gitleaks
        run: |
          make gitleaks

      - name: Run golangci-lint
        run: |
          make lint

      - name: Run unit tests
        run: |
          go test -v -tags locksmith_admin ./...

      - name: Run govulncheck policy guard
        run: |
          make govulncheck-ci

      - name: Verify Security Claims Traceability
        run: |
          chmod +x scripts/verify-claims.sh
          ./scripts/verify-claims.sh

      - name: Verify Fails-Before / Passes-After
        run: |
          chmod +x scripts/verify-fails-before.sh
          ./scripts/verify-fails-before.sh

      - name: Verify Context Freshness
        run: |
          chmod +x scripts/dev/update-context.sh
          ./scripts/dev/update-context.sh --structural-only
          if [[ -n $(git status --porcelain .memory/) ]]; then
            echo "ERROR: .memory/ documentation is out of sync with recent changes."
            echo "Please run ./scripts/dev/update-context.sh locally and commit the changes."
            git diff .memory/
            exit 1
          fi
