name: check
on:
  push:
    branches: [main, feature/**]
  pull_request:
  workflow_dispatch:

permissions: read-all


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-check:
    name: Code Quality & Security
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: true

      - name: Validate workflow files
        run: |
          chmod +x scripts/dev/validate-workflows.sh
          ./scripts/dev/validate-workflows.sh

      - name: Run Gitleaks
        run: |
          make gitleaks

      - name: Run golangci-lint
        run: |
          make lint

      - name: Run unit tests
        run: |
          go test -v -tags locksmith_admin ./...

      - name: Run govulncheck policy guard
        run: |
          make govulncheck-ci

      - name: Verify Context Freshness
        run: |
          chmod +x scripts/dev/update-context.sh
          ./scripts/dev/update-context.sh --structural-only
          if [[ -n $(git status --porcelain .memory/) ]]; then
            echo "ERROR: .memory/ documentation is out of sync with recent changes."
            echo "Please run ./scripts/dev/update-context.sh locally and commit the changes."
            git diff .memory/
            exit 1
          fi
