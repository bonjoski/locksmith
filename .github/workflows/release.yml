name: release

on:
  push:
    tags:
      - 'v*' # Triggers on version tags (e.g., v1.0.0)
  workflow_dispatch: # Allows manual trigger from Actions tab for testing

# 1. Explicitly set top-level permissions to minimal read-only safety baseline
permissions:
  contents: read

jobs:
  build-and-release:
    name: Build, Attest, and Release
    runs-on: macos-latest

    # 2. Grant specific write permissions only to this job
    permissions:
      contents: write       # Required to create the GitHub Release and upload assets
      id-token: write       # Required for signing the Artifact Attestation (OIDC)
      attestations: write   # Required to publish the build provenance to GitHub

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Enforce signed release tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF_NAME}"

          # Signed tags must be annotated tag objects, not lightweight commit refs.
          OBJ_TYPE="$(git cat-file -t "$TAG_NAME")"
          if [[ "$OBJ_TYPE" != "tag" ]]; then
            echo "::error::Tag ${TAG_NAME} is lightweight. Create a signed annotated tag with: git tag -s ${TAG_NAME} -m 'Release ${TAG_NAME}'"
            exit 1
          fi

          TAG_OBJECT_SHA="$(git rev-parse "${TAG_NAME}^{tag}")"
          VERIFIED="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${TAG_OBJECT_SHA}" --jq '.verification.verified')"
          REASON="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${TAG_OBJECT_SHA}" --jq '.verification.reason')"

          if [[ "$VERIFIED" != "true" ]]; then
            echo "::error::Tag ${TAG_NAME} signature is not verified by GitHub (reason: ${REASON})."
            exit 1
          fi

          echo "Verified signed tag ${TAG_NAME}."

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # master
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Install Desktop Dependencies
        run: |
          cd desktop
          npm ci

      - name: Configure and Launch GPG Agent
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "allow-preset-passphrase" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent || true
          gpgconf --launch gpg-agent

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v6.2.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Preset GPG Passphrase for Signing Subkey
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          PRESET_BIN=$(find /opt/homebrew/Cellar/gnupg -name gpg-preset-passphrase | head -1)
          if [ -n "$PRESET_BIN" ] && [ -n "$GPG_PASSPHRASE" ]; then
            "$PRESET_BIN" --preset --passphrase "$GPG_PASSPHRASE" AD1D8BE8792B5E21F3791642409FEEACE2DEBB91
            echo "✓ Passphrase preset for signing subkey AD1D8BE8"
          fi

      - name: Import macOS Certificate
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PWD }}

      - name: Build and Sign Locksmith
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # 1. Store credentials for notarization
          xcrun notarytool store-credentials "notarytool-profile" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_PASSWORD"

          # 2. List all available signing identities for diagnosis
          echo "=== Available codesigning identities ==="
          security find-identity -v -p codesigning
          echo "========================================"

          # 3. Export SIGN_ID as an env var (preserves quoting with spaces/parens)
          export SIGN_ID=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -n 1 | sed -E 's/.*"(.*)".*/\1/')
          echo "Using signing identity: [$SIGN_ID]"
          if [ -z "$SIGN_ID" ]; then
            echo "ERROR: No Developer ID Application certificate found in keychain!"
            exit 1
          fi

          # 4. Build all providers
          make build-summon
          # 5. Build and sign
          make release

      - name: Verify signing before notarization
        run: |
          echo "=== Strict codesign verify ==="
          codesign --verify --strict --verbose=4 bin/Locksmith-darwin-arm64.app
          codesign --verify --strict --verbose=4 bin/Locksmith-darwin-amd64.app
          codesign --verify --strict --verbose=4 bin/Summon-darwin-arm64.app
          codesign --verify --strict --verbose=4 bin/Summon-darwin-amd64.app
          codesign --verify --strict --verbose=4 bin/GitCredentialLocksmith-darwin-arm64.app
          codesign --verify --strict --verbose=4 bin/GitCredentialLocksmith-darwin-amd64.app
          if [ -d bin/LocksmithCockpit-darwin-arm64.app ]; then
            codesign --verify --strict --verbose=4 bin/LocksmithCockpit-darwin-arm64.app
          fi
          if [ -d bin/LocksmithCockpit-darwin-amd64.app ]; then
            codesign --verify --strict --verbose=4 bin/LocksmithCockpit-darwin-amd64.app
          fi
          echo "=== Gatekeeper assessment ==="
          spctl --assess --type execute --verbose bin/Locksmith-darwin-arm64.app || true
          spctl --assess --type execute --verbose bin/Locksmith-darwin-amd64.app || true
          spctl --assess --type execute --verbose bin/Summon-darwin-arm64.app || true
          spctl --assess --type execute --verbose bin/Summon-darwin-amd64.app || true
          spctl --assess --type execute --verbose bin/GitCredentialLocksmith-darwin-arm64.app || true
          spctl --assess --type execute --verbose bin/GitCredentialLocksmith-darwin-amd64.app || true
          if [ -d bin/LocksmithCockpit-darwin-arm64.app ]; then
            spctl --assess --type execute --verbose bin/LocksmithCockpit-darwin-arm64.app || true
          fi
          if [ -d bin/LocksmithCockpit-darwin-amd64.app ]; then
            spctl --assess --type execute --verbose bin/LocksmithCockpit-darwin-amd64.app || true
          fi
          echo "=== Dynamic library dependencies ==="
          otool -L bin/locksmith-darwin-arm64
          otool -L bin/locksmith-darwin-amd64
          otool -L bin/summon-locksmith-darwin-arm64
          otool -L bin/summon-locksmith-darwin-amd64
          otool -L bin/git-credential-locksmith-darwin-arm64
          otool -L bin/git-credential-locksmith-darwin-amd64
          if [ -f bin/locksmith-cockpit-darwin-arm64 ]; then
            otool -L bin/locksmith-cockpit-darwin-arm64
          fi
          if [ -f bin/locksmith-cockpit-darwin-amd64 ]; then
            otool -L bin/locksmith-cockpit-darwin-amd64
          fi

      - name: Notarize and Staple Release Apps
        run: make notarize && make staple
      - name: Generate Artifact Attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            bin/locksmith-*
            bin/summon-locksmith-*
            bin/git-credential-locksmith-*
            bin/Locksmith-*.zip
            bin/Summon-*.zip
            bin/GitCredentialLocksmith-*.zip
            bin/LocksmithCockpit-*.zip
            bin/*.app

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: spdx-json
          output-file: bin/locksmith.spdx.json
          path: .

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            bin/*
          generate_release_notes: true
