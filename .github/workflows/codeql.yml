name: CodeQL Security Analysis

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sundays at midnight UTC
  workflow_dispatch:

# Set strict permissions at the top level
permissions: read-all

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: macos-latest  # Required for CGO + macOS frameworks
    
    permissions:
      security-events: write  # Required to upload SARIF results
      contents: read          # Required to checkout code
      actions: read           # Required to read workflow metadata
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Unshallow Git history
        run: git fetch --unshallow || true

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.4'
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          languages: c-cpp, go  # Analyze both C/C++ (CGO) and Go code

      - name: Clean previous builds
        run: make clean

      - name: Build with CodeQL tracing
        run: make build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
