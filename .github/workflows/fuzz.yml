# .github/workflows/fuzz.yml
name: Fuzzing
on:
  schedule:
    - cron: '0 1 * * *' # Daily at 01:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Run Fuzzing
        run: |
          go test -fuzz=FuzzParseDuration -fuzztime=30s ./pkg/locksmith
          go test -fuzz=FuzzJSONUnmarshal -fuzztime=30s ./pkg/locksmith
          go test -fuzz=FuzzParseSPIFFEID -fuzztime=30s ./pkg/ca
          go test -fuzz=FuzzParseVsockAddr -fuzztime=30s ./pkg/spiffe
          go test -fuzz=FuzzMatchPattern -fuzztime=30s ./pkg/spiffe
          go test -tags=locksmith_admin -fuzz=FuzzParsePermittedIPs -fuzztime=30s ./cmd/locksmith/cmd
          go test -tags=locksmith_admin -fuzz=FuzzIsSovereignDomain -fuzztime=30s ./cmd/locksmith/cmd
